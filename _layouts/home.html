---
layout: default
---
<section class="hero">
  <h1 class="hero-heading">{{ page.hero_title | default: page.title | default: "Ellie Kim" }}</h1>
  <div class="hero-content">
    <div class="hero-image">
      <img
        src="{{ page.hero_image | default: 'https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?auto=format&fit=crop&w=800&q=80' }}"
        alt="{{ page.hero_image_alt | default: 'Portrait of Ellie Kim' }}"
        loading="lazy"
      />
    </div>
    <div class="hero-blurb">
      {{ content | markdownify }}
    </div>
  </div>
</section>
